aid: skyscanner
name: Skyscanner
description: >-
  Skyscanner is an Edinburgh, Scotland–headquartered global travel
  marketplace that helps travellers compare flights, hotels, and car hire
  across hundreds of airlines, hotel providers, and online travel agents.
  Founded in 2003 and acquired by Trip.com Group (formerly Ctrip) in 2016,
  Skyscanner operates the consumer site skyscanner.net and a B2B partner
  programme that powers travel search experiences for third-party
  publishers and apps. The Skyscanner Travel APIs — Flights Live Prices,
  Flights Indicative Prices, Hotels Live Prices, Hotels Indicative Prices,
  Hotels Content, Hotels Reviews, Car Hire Live Prices, Car Hire
  Indicative Prices, Car Hire Agents, plus utility services for Culture,
  Geo, Autosuggest, and Carriers — are gated behind a partner application
  process and exposed only to approved partners with significant audience
  scale; full API documentation, base URLs, and OpenAPI specifications
  are published inside the partner portal rather than on the public
  developer site. Alongside the Travel APIs, Skyscanner runs an
  Affiliate Programme (commission on referred bookings) and a
  Distribution Network connecting airlines, hotel providers, car-hire
  suppliers, and OTAs to its 160M+ monthly users. Its public GitHub
  organisation is best known for the Backpack design system and for
  open-source infrastructure tooling such as cfripper and turbolift,
  rather than for SDKs against the Travel APIs.
